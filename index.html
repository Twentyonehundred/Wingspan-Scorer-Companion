<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wingspan Scores</title>
    <meta name="description" content="Score pad, history and stats for Wingspan and its expansions." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wingspan" />
    <meta name="theme-color" content="#f2eada" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)" />
    <script>
      // Stamp the resolved theme before first paint so there is no flash.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('ws.theme') } catch (e) { /* private mode */ }
        var dark = saved ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
